<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conecta Gestão — Avaliar Evento · Gabriel Oliveira</title>
<meta name="description" content="Avalie eventos e festas realizados pela prefeitura.">
<link rel="canonical" href="https://conectagestao360.vercel.app/conecta-gestao-avaliar-evento.html">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2563EB">
<link rel="manifest" href="/manifest-avaliar-evento.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CG Avaliar">
<script src="/pwa-register.js" defer></script>
<style>
  :root{
    --royal:#2563EB; --neon:#3B82F6; --light:#60A5FA; --darkblue:#0F172A;
    --bg:#F8FAFC; --ink:#0F172A; --ink-soft:#475569; --line:rgba(15,23,42,.08);
    --ok:#059669; --danger:#DC2626;
    --sans:'Inter','IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{width:100%;max-width:440px;background:#fff;border-radius:18px;box-shadow:0 8px 24px rgba(15,23,42,.08);overflow:hidden;}
  .head{background:linear-gradient(150deg,var(--darkblue),var(--royal));color:#fff;padding:32px;text-align:center;}
  .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--royal),var(--light));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;margin:0 auto 14px;box-shadow:0 4px 14px rgba(37,99,235,.4);}
  .head h1{font-size:19px;margin:0 0 6px;font-weight:800;}
  .head p{font-size:12.5px;color:#B6C4DD;margin:0;}
  .body{padding:28px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);margin-bottom:9px;font-weight:700;}
  .field textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14.5px;background:#fff;font-family:var(--sans);resize:vertical;}
  .field textarea:focus{outline:none;border-color:var(--royal);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
  .quem{display:flex;gap:10px;}
  .quem button{flex:1;padding:13px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
  .quem button.on{border-color:var(--royal);background:#EFF6FF;color:var(--royal);}
  .stars{display:flex;gap:8px;font-size:32px;color:var(--line);cursor:pointer;justify-content:center;}
  .stars span.on{color:var(--royal);}
  .btn{width:100%;background:linear-gradient(135deg,var(--royal),var(--neon));color:#fff;border:none;padding:13px;border-radius:10px;font-size:14.5px;font-weight:700;cursor:pointer;}
  .btn:disabled{opacity:.6;}
  .msg{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:12.5px;line-height:1.6;display:none;}
  .msg.show{display:block;}
  .msg.error{background:#FEF2F2;color:#991B1B;border:1px solid #FCA5A5;}
  .msg.success{background:#ECFDF5;color:#065F46;border:1px solid #6EE7B7;}
  .resultados{display:none;padding:16px 28px 0;gap:12px;}
  .resultados.show{display:flex;}
  .resultado-item{flex:1;text-align:center;padding:12px 8px;background:#F8FAFC;border-radius:12px;}
  .resultado-item .val{font-size:20px;font-weight:800;color:var(--royal);}
  .resultado-item .lbl{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
</style>
</head>
<body>

<div class="card">
  <div class="head">
    <div class="logo">CG</div>
    <h1 id="titulo-evento">Avaliar evento</h1>
    <p>Sua opinião ajuda a melhorar os próximos eventos</p>
  </div>
  <div class="resultados" id="resultados">
    <div class="resultado-item"><div class="val" id="res-morador">—</div><div class="lbl">👥 Moradores</div></div>
    <div class="resultado-item"><div class="val" id="res-comerciante">—</div><div class="lbl">🏪 Comerciantes</div></div>
    <div class="resultado-item"><div class="val" id="res-total">—</div><div class="lbl">Total de avaliações</div></div>
  </div>
  <div class="body" id="form-body">
    <div class="field">
      <label>Você é</label>
      <div class="quem" id="quem-sou">
        <button type="button" data-v="morador" onclick="selecionarQuem(this)">Morador(a)</button>
        <button type="button" data-v="comerciante" onclick="selecionarQuem(this)">Comerciante (barraca)</button>
      </div>
    </div>
    <div class="field">
      <label>Sua nota para o evento</label>
      <div class="stars" id="stars"></div>
    </div>
    <div class="field">
      <label>Comentário (opcional)</label>
      <textarea id="comentario" rows="3" placeholder="Conte como foi sua experiência"></textarea>
    </div>
    <button class="btn" id="btn-enviar" onclick="enviarAvaliacao()">Enviar avaliação</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://kfvkembarvsbtveksiag.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_r4FgIemkyEcQiWCjj23cew_MdN2GVuL";
const DEMO_TENANT_ID = "00000000-0000-0000-0000-000000000001";

const params = new URLSearchParams(location.search);
const acaoId = params.get('acao');

let quemSou = null;
let notaEstrelas = 0;

async function sbGet(table, query){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, 'Accept-Profile': 'gestao360' },
  });
  if(!res.ok) throw new Error('GET failed');
  return res.json();
}

async function sbPost(table, body){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Profile': 'gestao360',
      'Content-Type': 'application/json',
      Prefer: 'return=representation',
    },
    body: JSON.stringify(body),
  });
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}

function selecionarQuem(btn){
  quemSou = btn.dataset.v;
  document.querySelectorAll('#quem-sou button').forEach(b => b.classList.toggle('on', b === btn));
}

function montarEstrelas(){
  document.getElementById('stars').innerHTML = [1,2,3,4,5].map(i => `<span data-v="${i}" onclick="setEstrelas(${i})">★</span>`).join('');
}
function setEstrelas(v){
  notaEstrelas = v;
  document.querySelectorAll('#stars span').forEach(s => s.classList.toggle('on', parseInt(s.dataset.v) <= v));
}

async function carregarTitulo(){
  if(!acaoId) return;
  try {
    const acoes = await sbGet('acoes', 'select=titulo&id=eq.' + acaoId);
    if(acoes.length) document.getElementById('titulo-evento').textContent = 'Avaliar: ' + acoes[0].titulo;
  } catch (e) { /* mantém título genérico se não conseguir carregar */ }
}

async function carregarResultados(){
  if(!acaoId) return;
  try {
    const avaliacoes = await sbGet('evento_avaliacoes', 'select=tipo_avaliador,nota&acao_id=eq.' + acaoId);
    if(!avaliacoes.length) return; // sem avaliações ainda — deixa o bloco escondido
    const media = (tipo) => {
      const notas = avaliacoes.filter(a => a.tipo_avaliador === tipo);
      return notas.length ? (notas.reduce((s,a) => s + Number(a.nota), 0) / notas.length / 2).toFixed(1) : '—';
    };
    document.getElementById('res-morador').textContent = media('morador');
    document.getElementById('res-comerciante').textContent = media('comerciante');
    document.getElementById('res-total').textContent = avaliacoes.length;
    document.getElementById('resultados').classList.add('show');
  } catch (e) { /* mantém escondido se não conseguir carregar */ }
}

async function enviarAvaliacao(){
  const msg = document.getElementById('msg');
  msg.className = 'msg';

  if(!acaoId){
    msg.textContent = 'Link inválido — falta identificar o evento.';
    msg.className = 'msg error show';
    return;
  }
  if(!quemSou){
    msg.textContent = 'Selecione se você é morador(a) ou comerciante.';
    msg.className = 'msg error show';
    return;
  }
  if(notaEstrelas === 0){
    msg.textContent = 'Selecione uma nota antes de enviar.';
    msg.className = 'msg error show';
    return;
  }

  const btn = document.getElementById('btn-enviar');
  btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    await sbPost('evento_avaliacoes', {
      tenant_id: DEMO_TENANT_ID,
      acao_id: acaoId,
      tipo_avaliador: quemSou,
      nota: notaEstrelas * 2,
      comentario: document.getElementById('comentario').value.trim() || null,
    });
    document.getElementById('form-body').innerHTML = '<div class="msg success show">Avaliação enviada — obrigado pela participação! 🎉</div>';
    carregarResultados();
  } catch (e) {
    msg.textContent = 'Não foi possível enviar agora. Tente novamente em instantes.';
    msg.className = 'msg error show';
    btn.disabled = false; btn.textContent = 'Enviar avaliação';
  }
}

montarEstrelas();
carregarTitulo();
carregarResultados();
</script>
<div id="cg-dev-credit" style="position:fixed;bottom:8px;right:12px;font-family:'Inter',sans-serif;font-size:10.5px;color:rgba(71,85,105,.7);background:rgba(255,255,255,.7);padding:5px 10px;border-radius:20px;backdrop-filter:blur(4px);z-index:99;pointer-events:none;">Desenvolvido por <strong>Gabriel Oliveira</strong> · Tecnologia e Manutenção</div>
</body>
</html>
